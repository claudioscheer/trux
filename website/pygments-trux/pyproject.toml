[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-trux"
version = "0.1.0"
description = "Pygments lexer for the Trux language, used by the documentation site."
requires-python = ">=3.9"
dependencies = ["Pygments>=2.12"]

[project.entry-points."pygments.lexers"]
trux = "trux_lexer:TruxLexer"

[tool.setuptools]
py-modules = ["trux_lexer"]
