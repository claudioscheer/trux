name: Docs

# Builds the documentation site (Hugo + Lotus Docs, sources in website/) on
# every push and pull request, checks that the example outputs shown on the
# site are still what the compiler produces, and deploys main to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Hugo downloads the Lotus Docs theme as a Go module, so it needs Go.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo && tar -xzf "$tarball" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo version
          hugo --gc --minify

      - name: Check the Markdown versions of the pages
        run: website/check-markdown-output.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  example-outputs:
    name: Check example outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compare website/outputs with real program output
        run: website/update-example-outputs.sh --check

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, example-outputs]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
